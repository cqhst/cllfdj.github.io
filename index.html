<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车辆来访登记系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { text-align: center; max-width: 480px; padding: 2rem; }
  .icon { font-size: 3rem; margin-bottom: 1rem; }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f1f5f9; }
  .subtitle { font-size: 0.9rem; color: #94a3b8; margin-bottom: 2rem; }
  .status { padding: 1.2rem; border-radius: 12px; margin-bottom: 1.5rem; }
  .status.loading { background: #1e293b; border: 1px solid #334155; }
  .status.online { background: #052e16; border: 1px solid #166534; }
  .status.offline { background: #1c1917; border: 1px solid #78350f; }
  .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .status-dot.loading { background: #3b82f6; animation: pulse 1.5s infinite; }
  .status-dot.online { background: #22c55e; }
  .status-dot.offline { background: #f59e0b; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .tunnel-url { word-break: break-all; font-size: 0.85rem; color: #38bdf8; margin-top: 0.5rem; }
  a.tunnel-url { text-decoration: none; }
  a.tunnel-url:hover { text-decoration: underline; }
  .btn { display: inline-block; margin-top: 1rem; padding: 0.75rem 2rem; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; text-decoration: none; transition: background 0.2s; }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { background: #334155; cursor: not-allowed; }
  .updated { font-size: 0.75rem; color: #64748b; margin-top: 1rem; }
  .error-msg { color: #f87171; font-size: 0.85rem; margin-top: 0.5rem; }
</style>
</head>
<body>
<div class="container">
  <div class="icon">&#128663;</div>
  <h1>车辆来访登记系统</h1>
  <p class="subtitle">重庆豪斯特车辆来访登记</p>
  
  <div id="status" class="status loading">
    <span class="status-dot loading"></span>
    <span id="statusText">正在获取公网地址...</span>
    <div id="urlDisplay"></div>
  </div>
  
  <a id="enterBtn" class="btn" style="display:none" href="#" target="_blank">进入系统</a>
  <div id="updated" class="updated"></div>
  <div id="error" class="error-msg"></div>
</div>

<script>
(function() {
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  var urlDisplay = document.getElementById('urlDisplay');
  var enterBtn = document.getElementById('enterBtn');
  var updatedEl = document.getElementById('updated');
  var errorEl = document.getElementById('error');
  var dot = statusEl.querySelector('.status-dot');

  function setStatus(type, text) {
    statusEl.className = 'status ' + type;
    dot.className = 'status-dot ' + type;
    statusText.textContent = text;
  }

  function loadTunnelUrl() {
    setStatus('loading', '正在获取公网地址...');
    errorEl.textContent = '';
    
    var t = Date.now();
    fetch('./tunnel-url.json?t=' + t)
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) {
        if (data && data.url) {
          setStatus('online', '系统在线');
          urlDisplay.innerHTML = '<a class="tunnel-url" href="' + data.url + '" target="_blank">' + data.url + '</a>';
          enterBtn.href = data.url;
          enterBtn.style.display = 'inline-block';
          if (data.updated) {
            var d = new Date(data.updated);
            updatedEl.textContent = '更新时间: ' + d.toLocaleString('zh-CN');
          }
          // 5秒后自动跳转
          setTimeout(function() { window.location.href = data.url; }, 3000);
        } else {
          setStatus('offline', '暂无公网地址');
          errorEl.textContent = '系统可能正在启动中，请稍后刷新重试';
        }
      })
      .catch(function(e) {
        setStatus('offline', '连接失败');
        errorEl.textContent = '无法获取公网地址: ' + e.message + '，请稍后刷新';
      });
  }

  loadTunnelUrl();
  // 每30秒自动刷新
  setInterval(loadTunnelUrl, 30000);
})();
</script>
</body>
</html>
